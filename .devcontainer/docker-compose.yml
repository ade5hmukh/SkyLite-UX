version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Forwards the local Docker socket to the container.
      - /var/run/docker.sock:/var/run/docker-host.sock
      - ../..:/workspaces:cached
    working_dir: /workspaces/SkyLite-UX
    environment:
      # consola log level. See https://github.com/unjs/consola/blob/main/src/constants.ts
      - NUXT_PUBLIC_LOG_LEVEL=verbose
      - NUXT_PUBLIC_TZ=America/Los_Angeles
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    # Auto-start dev server
    command: bash -c "npm install && npm run dev"
    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "3003:3000"  # Nuxt dev server (via app container network sharing)
      - "5433:5432"  # PostgreSQL
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
