services:
  skylite-ux:
    build:
      context: .
      dockerfile: Dockerfile.simple
      args:
        - NODE_OPTIONS=--max-old-space-size=4096
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://skylite:password@skylite-ux-db:5432/skylite
      - NUXT_PUBLIC_TZ=America/Los_Angeles
      - NUXT_PUBLIC_LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=2048
    depends_on:
      skylite-ux-db:
        condition: service_healthy
    ports:
      - 3000:3000
    networks:
      - skylite-network
    # Memory limits to prevent system crash
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  skylite-ux-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=skylite
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=skylite
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skylite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skylite-network
    # Memory limits for database
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  skylite-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local

